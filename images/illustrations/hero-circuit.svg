<svg class="hero-art h-auto w-full" viewBox="0 0 600 540" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="heroArtTitle">
  <title id="heroArtTitle">Line drawing of a fuse board feeding a pendant light and a double socket</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.2" fill="#BCC3FF"/></pattern>
    <radialGradient id="lampLight" cx=".5" cy=".3" r=".6"><stop offset="0" stop-color="#FFCF4A" stop-opacity=".75"/><stop offset=".45" stop-color="#FFCF4A" stop-opacity=".22"/><stop offset="1" stop-color="#FFCF4A" stop-opacity="0"/></radialGradient>
    <clipPath id="wallClip"><rect x="30" y="40" width="540" height="460" rx="30"/></clipPath>
  </defs>

  <!-- wall -->
  <rect x="30" y="40" width="540" height="460" rx="30" fill="#EEF0FF"/>
  <rect x="30" y="40" width="540" height="460" rx="30" fill="url(#dots)" opacity=".7"/>

  <!-- open blue frame, after the bracket in the logo -->
  <g stroke="#0D21FF" stroke-width="3">
    <path d="M62 148V86a18 18 0 0 1 18-18h126"/>
    <path d="M396 68h122a18 18 0 0 1 18 18v196"/>
    <path d="M536 404v48a18 18 0 0 1-18 18H80a18 18 0 0 1-18-18V286"/>
  </g>

  <!-- lamp light (behind everything on the right) -->
  <g clip-path="url(#wallClip)"><ellipse class="lamp-glow" cx="440" cy="285" rx="150" ry="160" fill="url(#lampLight)"/></g>

  <!-- cables: ink base -->
  <g stroke="#0B0C10" stroke-width="2.5">
    <path d="M256 190V132q0-18 18-18h166v6"/>
    <path d="M272 340v54q0 18 18 18h106"/>
    <path d="M132 340v52q0 18 18 18h2" stroke-width="2"/>
  </g>
  <!-- cable clips -->
  <g fill="#fff" stroke="#0B0C10" stroke-width="2"><circle cx="256" cy="160" r="4"/><circle cx="340" cy="114" r="4"/><circle cx="272" cy="372" r="4"/><circle cx="340" cy="412" r="4"/></g>
  <!-- cables: blue once live -->
  <g stroke="#0D21FF" stroke-width="2.5">
    <path class="cable-live" pathLength="100" d="M256 190V132q0-18 18-18h166v6"/>
    <path class="cable-live" pathLength="100" d="M272 340v54q0 18 18 18h106"/>
  </g>
  <!-- current pulses -->
  <g stroke="#0D21FF" stroke-width="6">
    <path class="pulse" pathLength="100" d="M256 190V132q0-18 18-18h166v6"/>
    <path class="pulse pulse-b" pathLength="100" d="M272 340v54q0 18 18 18h106"/>
  </g>

  <!-- pendant light -->
  <rect x="426" y="104" width="28" height="10" rx="3" fill="#fff" stroke="#0B0C10" stroke-width="2.5"/>
  <path d="M440 120v68" stroke="#0B0C10" stroke-width="2.5"/>
  <path d="M432 188h16v10h-16z" fill="#0B0C10" stroke="#0B0C10" stroke-width="2.5"/>
  <circle class="bulb" cx="440" cy="236" r="12" fill="#fff" stroke="#0B0C10" stroke-width="2.5"/>
  <path d="M400 236l18-38h44l18 38z" fill="#fff" stroke="#0B0C10" stroke-width="2.5"/>
  <path d="M414 228h52" stroke="#D9DBE3" stroke-width="2"/>
  <path class="bulb" d="M426 236a14 14 0 0 0 28 0z" fill="#fff" stroke="#0B0C10" stroke-width="2.5"/>

  <!-- fuse board -->
  <g>
    <!-- construction ticks -->
    <g stroke="#8A8C93" stroke-width="1.5"><path d="M80 190h12M96 174v12M312 190h12M308 174v12M80 340h12M96 344v12M312 340h12M308 344v12"/></g>
    <rect x="96" y="190" width="212" height="150" rx="12" fill="#fff" stroke="#0B0C10" stroke-width="2.5"/>
    <path d="M96 214h212" stroke="#0B0C10" stroke-width="2"/>
    <circle cx="112" cy="202" r="3" fill="#0B0C10"/><circle cx="292" cy="202" r="3" fill="#0B0C10"/>
    <rect x="110" y="228" width="184" height="80" rx="6" fill="#F3F4F8" stroke="#0B0C10" stroke-width="2"/>
    <!-- main switch -->
    <rect x="118" y="236" width="30" height="64" rx="4" fill="#0D21FF" stroke="#0B0C10" stroke-width="2"/>
    <rect x="127" y="246" width="12" height="18" rx="2" fill="#fff"/>
    <!-- MCBs -->
    <g fill="#fff" stroke="#0B0C10" stroke-width="2">
      <rect x="156" y="242" width="18" height="54" rx="3"/><rect x="178" y="242" width="18" height="54" rx="3"/><rect x="200" y="242" width="18" height="54" rx="3"/>
      <rect x="222" y="242" width="18" height="54" rx="3"/><rect x="244" y="242" width="18" height="54" rx="3"/><rect x="266" y="242" width="18" height="54" rx="3"/>
    </g>
    <g fill="#0B0C10">
      <rect x="161" y="250" width="8" height="13" rx="1.5"/><rect x="183" y="250" width="8" height="13" rx="1.5"/><rect x="205" y="250" width="8" height="13" rx="1.5"/>
      <rect x="249" y="250" width="8" height="13" rx="1.5"/><rect x="271" y="250" width="8" height="13" rx="1.5"/>
    </g>
    <rect class="toggle" x="227" y="250" width="8" height="13" rx="1.5" fill="#0D21FF"/>
    <!-- label strip -->
    <path d="M118 322h40M168 322h24M202 322h46M258 322h28" stroke="#BCC3FF" stroke-width="4"/>
    <!-- dimension line -->
    <g stroke="#8A8C93" stroke-width="1.25"><path d="M96 366h82M226 366h82M96 359v14M308 359v14"/></g>
    <path d="M188 366h28" stroke="#0D21FF" stroke-width="2.5"/>
  </g>

  <!-- double socket -->
  <g>
    <rect x="396" y="378" width="120" height="68" rx="12" fill="#fff" stroke="#0B0C10" stroke-width="2.5"/>
    <g fill="#0B0C10">
      <rect x="420" y="393" width="5" height="13" rx="1"/><rect x="410" y="414" width="11" height="5" rx="1"/><rect x="425" y="414" width="11" height="5" rx="1"/>
      <rect x="476" y="393" width="5" height="13" rx="1"/><rect x="466" y="414" width="11" height="5" rx="1"/><rect x="481" y="414" width="11" height="5" rx="1"/>
    </g>
    <rect x="448" y="392" width="10" height="16" rx="2" fill="#fff" stroke="#0B0C10" stroke-width="2"/>
    <rect x="502" y="392" width="6" height="16" rx="2" fill="#fff" stroke="#0B0C10" stroke-width="2"/>
    <circle class="led" cx="453" cy="430" r="3.5" fill="#D9DBE3"/>
    <circle class="led" cx="505" cy="430" r="3.5" fill="#D9DBE3"/>
  </g>

  <!-- light switch -->
  <g>
    <rect x="152" y="410" width="54" height="54" rx="10" fill="#fff" stroke="#0B0C10" stroke-width="2.5"/>
    <rect x="170" y="422" width="18" height="30" rx="4" fill="#F3F4F8" stroke="#0B0C10" stroke-width="2"/>
    <path d="M172 437h14" stroke="#0B0C10" stroke-width="2"/>
  </g>

  <!-- small drafting accents -->
  <g class="float" stroke="#0D21FF" stroke-width="2.5">
    <circle cx="112" cy="110" r="20" fill="#fff"/>
    <path d="M115 96l-9 15h10l-6 13" stroke-width="2.5"/>
  </g>
  <g stroke="#8A8C93" stroke-width="1.5"><path d="M500 140v14M493 147h14M360 300v12M354 306h12M206 468v10M201 473h10"/></g>
</svg>
